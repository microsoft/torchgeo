name: deploy
on:
  release:
    types:
      - published
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          activate-environment: true
          enable-cache: false
      - name: Build project
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
  pypi:
    name: pypi
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/torchgeo
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          activate-environment: true
          enable-cache: false
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish
