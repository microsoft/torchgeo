name: tutorials
on:
  push:
    branches:
      - main
    paths:
      - docs/tutorials/**
  pull_request:
    branches:
      - main
    paths:
      - docs/tutorials/**
defaults:
  run:
    shell: bash
jobs:
  notebooks:
    name: notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'requirements/*.txt'
          cache-suffix: tutorials
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -r requirements/required.txt -r requirements/docs.txt -r requirements/tests.txt planetary_computer pystac tensorboard h5py scikit-learn .
      - name: List dependencies
        run: uv pip list
      - name: Run notebook checks
        run: |
          source .venv/bin/activate
          pytest --nbmake --durations=10 docs/tutorials
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
