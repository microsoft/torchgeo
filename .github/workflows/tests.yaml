name: tests
on:
  push:
    branches:
      - main
      - release**
  pull_request:
    branches:
      - main
      - release**
defaults:
  run:
    shell: bash
jobs:
  latest:
    name: latest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/*.txt"
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install pip dependencies
        run: uv pip install --system -r requirements/required.txt -r requirements/datasets.txt -r requirements/models.txt -r requirements/tests.txt
      - name: List pip dependencies
        run: uv pip list --system
      - name: Run pytest checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python3 -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  minimum:
    name: minimum
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/*.old"
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'
      - name: Install pip dependencies
        run: uv pip install --system -r requirements/min-reqs.old
      - name: List pip dependencies
        run: uv pip list --system
      - name: Run pytest checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python3 -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  optional:
    name: optional
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/*.txt"
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.14'
      - name: Install pip dependencies
        run: uv pip install --system -r requirements/required.txt -r requirements/tests.txt
      - name: List pip dependencies
        run: uv pip list --system
      - name: Run pytest checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python3 -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
