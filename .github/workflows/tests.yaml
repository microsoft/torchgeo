name: tests
on:
  push:
    branches:
      - main
      - release**
  pull_request:
    branches:
      - main
      - release**
defaults:
  run:
    shell: bash
jobs:
  latest:
    name: latest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Clone repo
        uses: actions/checkout@v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: List dependencies
        run: uv pip list
      - name: Run pytest checks
        run: |
          uv run pytest --cov=torchgeo --cov-report=xml
          uv run python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  minimum:
    name: minimum
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install pip dependencies
        run: uv sync --all-extras --resolution lowest-direct
      - name: List dependencies
        run: uv pip list
      - name: Run pytest checks
        run: |
          uv run --resolution lowest-direct pytest --cov=torchgeo --cov-report=xml -p no:nbmake
          uv run --resolution lowest-direct python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  optional:
    name: optional
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra tests
      - name: List dependencies
        run: uv pip list
      - name: Run pytest checks
        run: |
          uv run pytest --cov=torchgeo --cov-report=xml
          uv run python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
