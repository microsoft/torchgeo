name: tests
on:
  push:
    branches:
      - main
      - release**
  pull_request:
    branches:
      - main
      - release**
defaults:
  run:
    shell: bash
jobs:
  latest:
    name: latest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: 'requirements/*.txt'
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -r requirements/required.txt -r requirements/datasets.txt -r requirements/models.txt -r requirements/tests.txt
      - name: List dependencies
        run: uv pip list
      - name: Run pytest checks
        run: |
          uv run --no-sync pytest --cov=torchgeo --cov-report=xml
          uv run --no-sync python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  minimum:
    name: minimum
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'requirements/min-reqs.old'
          cache-suffix: minimum
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -r requirements/min-reqs.old
      - name: List dependencies
        run: uv pip list
      - name: Run pytest checks
        run: |
          uv run --no-sync pytest --cov=torchgeo --cov-report=xml
          uv run --no-sync python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  optional:
    name: optional
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'requirements/*.txt'
          cache-suffix: optional
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -r requirements/required.txt -r requirements/tests.txt
      - name: List dependencies
        run: uv pip list
      - name: Run pytest checks
        run: |
          uv run --no-sync pytest --cov=torchgeo --cov-report=xml
          uv run --no-sync python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
