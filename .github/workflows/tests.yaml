name: tests
on:
  push:
    branches:
      - main
      - release**
  pull_request:
    branches:
      - main
      - release**
defaults:
  run:
    shell: bash
jobs:
  latest:
    name: latest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14', '3.14t']
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: |
          extras='--extra datasets --extra tests'
          # Free-threaded Python lacks published wheels for parts of the optional
          # model stack, notably OpenCV via RF-DETR.
          if [[ '${{ matrix.python-version }}' != '3.14t' ]]; then
            extras="$extras --extra models"
          fi
          uv sync --locked $extras
      - name: List installed dependencies
        run: uv tree
      - name: Run checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  minimum:
    name: minimum
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Install dependencies
        run: uv pip install --resolution lowest-direct '.[datasets,models,tests]'
      - name: List installed dependencies
        run: uv tree
      - name: Run checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  optional:
    name: optional
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra tests
      - name: List installed dependencies
        run: uv tree
      - name: Run checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
