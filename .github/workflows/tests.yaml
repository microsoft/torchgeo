name: tests
on:
  push:
    branches:
      - main
      - release**
  pull_request:
    branches:
      - main
      - release**
defaults:
  run:
    shell: bash
jobs:
  latest:
    name: latest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # rfdetr depends on opencv-python which ships only abi3 wheels — abi3 is
        # incompatible with free-threaded Python, and no sdist is available to
        # build from source, so 3.14t cannot install the models extras.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra datasets --extra models --extra tests
      - name: List installed dependencies
        run: uv tree
      - name: Run checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  minimum:
    name: minimum
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Install dependencies
        run: uv pip install --resolution lowest-direct '.[datasets,models,tests]'
      - name: List installed dependencies
        run: uv tree
      - name: Run checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  optional:
    name: optional
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra tests
      - name: List installed dependencies
        run: uv tree
      - name: Run checks
        run: |
          pytest --cov=torchgeo --cov-report=xml
          python -m torchgeo --help
      - name: Report coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
