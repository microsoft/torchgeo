name: release
on:
  push:
    branches:
      - release**
  pull_request:
    branches:
      - release**
defaults:
  run:
    shell: bash
jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          cache-suffix: integration
      - name: Install dependencies
        run: uv pip install --system .[datasets,tests]
      - name: List dependencies
        run: uv pip list --system
      - name: Run integration checks
        run: |
          pytest -m slow --durations=10 tests/samplers
          pytest -m slow --durations=10 tests/trainers
          python -m torchgeo --help
          torchgeo --help
  notebooks:
    name: notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          cache-suffix: release-notebooks
      - name: Install dependencies
        run: uv pip install --system .[docs,tests] planetary_computer pystac tensorboard h5py scikit-learn
      - name: List dependencies
        run: uv pip list --system
      - name: Run notebook checks
        run: pytest --nbmake --durations=10 docs/tutorials
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
