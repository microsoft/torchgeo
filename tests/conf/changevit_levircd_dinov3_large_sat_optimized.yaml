# ChangeViT with DINOv3-Large-SAT
# Model: vit_large_patch16_dinov3.sat493m (323M parameters)
# Pretrained on 493M satellite images @ 0.6m resolution
#
# Key hyperparameters for large pretrained models:
# - weight_decay: 1e-4 (important for preserving pretrained features)
# - Gradient accumulation: 4x for effective batch size of 48
# - Gradient clipping: 1.0 for training stability
# - AdamW optimizer with lr: 1e-4

model:
  class_path: ChangeDetectionTask
  init_args:
    model: 'changevit_large_dinov3_sat'
    task: 'binary'
    loss: 'bce+dice'
    class_weights: [0.55016005, 1.44984]
    lr: 1e-4
    num_classes: 2

data:
  class_path: LEVIRCDDataModule
  init_args:
    batch_size: 12
    patch_size: 256
    num_workers: 4
    dataset_variant: 'levircd'
    val_patch_sampling: 'random'
  dict_kwargs:
    root: 'data'

trainer:
  max_steps: 80000
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: 20
  log_every_n_steps: 10
  enable_progress_bar: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: 'changevit_dinov3_large_sat_OPTIMIZED'
      project: 'torchgeo-changevit'
      tags:
        [
          'dinov3',
          'large',
          'satellite',
          'patch16',
          'optimized',
          'wd-1e-4',
          'lr-1e-4',
          'bs48-eff',
        ]
  callbacks:
    - class_path: lightning.pytorch.callbacks.RichModelSummary
      init_args:
        max_depth: 2
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: 'val_BinaryF1Score'
        mode: 'max'
        save_top_k: 3
        save_last: true
        filename: 'dinov3_large_sat_opt_step{step}_valF1{val_BinaryF1Score:.4f}'
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: 'step'

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
    betas: [0.9, 0.999]
    weight_decay: 1e-4
    eps: 1.0e-08
lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 80000
    power: 0.9
