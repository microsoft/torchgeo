# ChangeViT config for LEVIR-CD dataset
# Paper: https://arxiv.org/abs/2406.12847

model:
  class_path: ChangeDetectionTask
  init_args:
    model: 'changevit'
    backbone: 'vit_small_patch16_dinov3.lvd1689m'
    task: 'binary'
    loss: 'dice'
    lr: 1e-4
    num_classes: 2

data:
  class_path: LEVIRCDDataModule
  init_args:
    batch_size: 12
    patch_size: 256
    num_workers: 4
  dict_kwargs:
    root: 'data'

trainer:
  max_steps: 80000
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: 20
  log_every_n_steps: 10
  enable_progress_bar: true

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
    betas: [0.9, 0.999]
    weight_decay: 1e-4

lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 80000
    power: 0.9
