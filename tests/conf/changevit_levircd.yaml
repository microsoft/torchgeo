# ChangeViT config for LEVIR-CD dataset
# Paper: https://arxiv.org/abs/2406.12847
#
# This config uses DINOv3-Large-SAT backbone (323M params)
# Pretrained on 493M satellite images @ 0.6m resolution
#
# NOTE: For best results, consider:
# 1. Combined BCE+Dice loss (paper shows this helps with class imbalance)
# 2. Random patch sampling for validation (addresses train/val distribution mismatch)
# These features would require updates to ChangeDetectionTask and LEVIRCDDataModule

model:
  class_path: ChangeDetectionTask
  init_args:
    model: 'changevit'
    backbone: 'large_dinov3_sat' # Options: tiny, small, small_dinov3, large, large_dinov3_sat
    task: 'binary'
    loss: 'bce' # Paper uses bce+dice but combined loss not yet available
    lr: 1e-4
    num_classes: 2

data:
  class_path: LEVIRCDDataModule
  init_args:
    batch_size: 12
    patch_size: 256
    num_workers: 4
  dict_kwargs:
    root: 'data'

trainer:
  max_steps: 80000
  accumulate_grad_batches: 4 # Effective batch size: 48
  gradient_clip_val: 1.0
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: 20
  log_every_n_steps: 10

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
    betas: [0.9, 0.999]
    weight_decay: 1e-4

lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 80000
    power: 0.9
