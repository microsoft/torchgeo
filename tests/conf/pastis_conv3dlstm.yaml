model:
  class_path: SpatioTemporalSegmentation
  init_args:
    model: 'conv3dlstm'
    in_channels: 10
    task: 'multiclass'
    num_classes: 20
    ignore_index: 19
    loss: 'ce'
  dict_kwargs:
    conv3d_dim: 8
    hidden_dim: 8
    num_layers: 1
    conv3d_kernel_size: 3
    kernel_size: 3
    head_kernel_size: 1
data:
  class_path: PASTISDataModule
  init_args:
    batch_size: 2
    padding_length: 9
  dict_kwargs:
    root: 'tests/data/pastis'
