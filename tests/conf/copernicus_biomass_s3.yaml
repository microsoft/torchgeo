model:
  class_path: PixelwiseRegressionTask
  init_args:
    model: 'unet'
    backbone: 'resnet18'
    in_channels: 3
    loss: 'mae'
data:
  class_path: CopernicusBenchBiomassS3DataModule
  init_args:
    batch_size: 1
  dict_kwargs:
    root: 'tests/data/copernicus/l3_biomass_s3'
    bands:
      - 'Oa08_radiance'
      - 'Oa06_radiance'
      - 'Oa04_radiance'
