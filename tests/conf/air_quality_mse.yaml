model:
  class_path: TemporalRegressionTask
  init_args:
    in_features: 17
    out_features: 17
    loss: 'mse'
  dict_kwargs:
    len_max_seq: 3
data:
  class_path: AirQualityDataModule
  init_args:
    batch_size: 2
    val_split_pct: 0.3
    test_split_pct: 0.3
  dict_kwargs:
    root: 'tests/data/air_quality'
