model:
  class_path: SpatioTemporalSegmentation
  init_args:
    model: 'utae'
    in_channels: 10
    task: 'multiclass'
    num_classes: 20
    ignore_index: 19
    loss: 'focal'
  dict_kwargs:
    encoder_widths: [16, 16]
    decoder_widths: [8, 16]
    n_head: 4
    d_model: 16
    d_k: 4
data:
  class_path: PASTISDataModule
  init_args:
    batch_size: 2
    padding_length: 9
  dict_kwargs:
    root: 'tests/data/pastis'
