model:
  class_path: SpatioTemporalSegmentation
  init_args:
    model: 'convlstm'
    in_channels: 10
    task: 'multiclass'
    num_classes: 20
    loss: 'ce'
  dict_kwargs:
    hidden_dim: 8
    num_layers: 1
    kernel_size: 3
    head_kernel_size: 1
data:
  class_path: PASTIS100DataModule
  init_args:
    batch_size: 3
    padding_length: 9
  dict_kwargs:
    root: 'tests/data/pastis'
