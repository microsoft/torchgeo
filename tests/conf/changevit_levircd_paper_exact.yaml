# ChangeViT config matching the paper EXACTLY
# Paper: https://arxiv.org/html/2406.12847v1
# Section IV-A Implementation Details
#
# Changes from broken config:
# 1. Added BCE+Dice combined loss (paper requirement)
# 2. Added random flipping augmentation (paper requirement)
# 3. Using val_patch_sampling='random' (our fix for position mismatch)
# 4. Batch size 16 (paper's setting, not 32)
# 5. LR 2e-4 (paper's setting, not scaled)

model:
  class_path: ChangeDetectionTask
  init_args:
    model: 'changevit_small'
    task: 'binary'
    loss: 'bce+dice' # Paper: "BCE and dice loss to alleviate class imbalance"
    class_weights: [0.55, 1.45] # From original repo
    lr: 8e-5 # Will be overridden by optimizer config
    num_classes: 2

data:
  class_path: LEVIRCDDataModule
  init_args:
    batch_size: 16 # Paper setting
    patch_size: 256
    num_workers: 4
    dataset_variant: 'levircd'
    val_patch_sampling: 'random' # Our fix for position mismatch
  dict_kwargs:
    root: 'data'

trainer:
  max_steps: 80000 # Paper: "80K iterations on LEVIR-CD"
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: 20 # Validate every 20 epochs
  log_every_n_steps: 10 # Changed from 50 (28 batches/epoch with bs=16)
  enable_progress_bar: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: 'changevit_paper_exact_oct8'
      project: 'torchgeo-changevit'
      tags: ['paper_exact', 'bce+dice', 'flips', 'bs16']
  callbacks:
    - class_path: lightning.pytorch.callbacks.RichModelSummary
      init_args:
        max_depth: 2
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: 'val_BinaryF1Score'
        mode: 'max'
        save_top_k: 3
        save_last: true
        filename: 'changevit_paper_step{step}_valF1{val_BinaryF1Score:.4f}'
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: 'step'

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 2e-4 # Paper: "initial learning rate of 2e-4"
    betas: [0.9, 0.99] # Paper: "beta values (0.9, 0.99)"
    weight_decay: 1e-4 # Paper: "weight decay 1e-4"

lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 80000 # Match max_steps
    power: 0.9 # Paper: "(1-(curr_iter/max_iter))^0.9"
