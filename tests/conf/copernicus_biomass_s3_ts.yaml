model:
  class_path: SpatioTemporalPixelwiseRegression
  init_args:
    in_channels: 3
    loss: 'mse'
  dict_kwargs:
    hidden_dim: 8
    num_layers: 1
    kernel_size: 3
    head_kernel_size: 1
data:
  class_path: CopernicusBenchBiomassS3DataModule
  init_args:
    batch_size: 1
  dict_kwargs:
    root: 'tests/data/copernicus/l3_biomass_s3'
    mode: 'time-series'
    bands:
      - 'Oa08_radiance'
      - 'Oa06_radiance'
      - 'Oa04_radiance'
